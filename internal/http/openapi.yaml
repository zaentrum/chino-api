openapi: 3.0.3
info:
  title: chino-api
  version: 0.1.0
  description: |
    Backend API for the chino product of the zaentrum platform.

    A viewer whose access token carries `max_rating`, a whole number of years
    (a kid's account), is capped at that age; a claim that is no whole number
    of years is the strictest cap, 0, and a token without it is not capped.
    A capped viewer is served only the titles the catalog rates at most its
    cap (an episode as its series, unless an admin rated it), and the unrated
    ones only when the catalog's setting `ratings.unrated_for_capped` says
    show. A title it may not be served is as one there is not: every route of
    one title answers it 404 "not found", with its bearer and with its stream
    token (which carries the cap of the bearer it was minted with), and the
    lists (browse, search, people, continue watching, history, watchlists,
    likes, the Zap feeds) leave it out. chino-api passes the cap on to the
    catalog with every request.
servers:
  - url: /api
paths:
  /healthz:
    get:
      summary: Liveness / readiness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  product: { type: string }
  /v1/me:
    get:
      summary: Echo the caller's OIDC subject
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
    delete:
      summary: Delete the signed-in person's data and their account
      description: >-
        Deletes what chino-api keeps of the person (playback progress, watch
        history, named watchlists and their items, likes) and asks
        portal-api, with the person's bearer and the account deletion token,
        to delete their account (DELETE /api/portal/me). The rows are deleted
        in a transaction committed only once the account is deleted or gone
        already; when portal-api refuses or does not answer, nothing is
        deleted. The bearer goes in the Authorization header: a stream token
        is not taken, and a bearer in ?token= is refused.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The data deleted, and the account deleted (account deleted) or found gone already (account gone)
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { type: string, enum: [deleted, gone] }
                  deleted: { $ref: "#/components/schemas/DeletedData" }
        "400":
          description: The bearer was sent in the URL (?token=)
        "401":
          description: No bearer, or one that is not valid
        "409":
          description: >-
            portal-api refuses: the person is the last admin, or an
            administrator of Keycloak itself. Nothing is deleted; message
            says why, for the person.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountRefusal" }
        "501":
          description: >-
            Account deletion is not set up (no ACCOUNT_DELETION_TOKEN):
            accounts live in an identity provider the platform does not
            manage. Nothing is deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountRefusal" }
        "502":
          description: portal-api did not delete the account; nothing is deleted, and asking again starts over
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountRefusal" }
  /v1/items:
    get:
      summary: List items for this product (stub during beta)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
  /v1/items/{id}:
    get:
      summary: An item with its genres, cast, subtitles, trailers, extras and segments
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "404":
          description: No such item, or one the viewer's rating cap does not allow
        "502":
          description: The catalog failed
  /v1/people:
    get:
      summary: Search people by name
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: empty answers an empty list
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  people:
                    type: array
                    items: { $ref: "#/components/schemas/Person" }
                  total: { type: integer }
        "502":
          description: The catalog failed
  /v1/people/{id}:
    get:
      summary: A person, their details and their filmography
      description: >
        The filmography is one card per title, newest first, each with the
        person's roles on it. The biography is in the language `lang` names,
        else the first of Accept-Language's the catalog has, else English,
        else any; the response varies on Accept-Language.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - in: query
          name: lang
          schema: { type: string }
          description: biography language (a language tag; its primary subtag counts)
        - in: header
          name: Accept-Language
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonDetail" }
        "404":
          description: No such person
        "502":
          description: The catalog failed
  /v1/people/{id}/profile:
    get:
      summary: A person's portrait (what profile_url points at)
      description: >
        Proxied from the catalog manager with the posters' auth: a bearer
        or ?stream= (a stream token), so an <img src> works (?token=, the
        bearer in the URL, is deprecated and goes in the next release). Range and
        If-None-Match pass through; so do the upstream's status and headers
        (ETag, 304, 404).
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The image
          content:
            image/*:
              schema: { type: string, format: binary }
        "304":
          description: Not modified (If-None-Match matched the ETag)
        "404":
          description: The person has no portrait
  /v1/me/watchlists:
    get:
      summary: List the caller's named watchlists
      description: Default list first, then others by createdAt ascending.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  lists:
                    type: array
                    items: { $ref: "#/components/schemas/Watchlist" }
        "401":
          description: Unauthorized
    post:
      summary: Create a new named watchlist
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watchlist" }
        "400":
          description: Empty / over-length name
        "409":
          description: Too many lists (max 50) or case-insensitive duplicate name
  /v1/me/watchlists/memberships:
    get:
      summary: Which of the caller's lists each item belongs to
      description: >
        Powers the add-to-list picker checkmarks and the card "saved" badge.
        Items not in any list may be omitted or map to an empty array.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: ids
          required: true
          schema: { type: string }
          description: comma-separated item ids (max ~100)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  memberships:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }
        "401":
          description: Unauthorized
  /v1/me/watchlists/{listId}:
    get:
      summary: A single list's metadata + item ids
      description: Items newest-added first.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: listId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  isDefault: { type: boolean }
                  items:
                    type: array
                    items: { type: string }
        "404":
          description: Not the caller's list
    patch:
      summary: Rename a list
      description: Renaming the default list keeps isDefault=true.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: listId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watchlist" }
        "400":
          description: Empty / over-length name
        "404":
          description: Not the caller's list
        "409":
          description: Case-insensitive duplicate name
    delete:
      summary: Delete a list (cascades its items)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: listId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not the caller's list
        "409":
          description: Cannot delete the default list
  /v1/me/watchlists/{listId}/items/{itemId}:
    put:
      summary: Add an item to a list (idempotent)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: listId
          required: true
          schema: { type: string }
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Added (or already present)
        "404":
          description: Not the caller's list
    delete:
      summary: Remove an item from a list (idempotent)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: listId
          required: true
          schema: { type: string }
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed (or already absent)
        "404":
          description: Not the caller's list
  /v1/me/watchlist:
    get:
      summary: The default list's item ids (back-compat alias)
      description: >
        Back-compat alias kept for already-installed mobile/TV builds. Now
        maps to the caller's default list (lazily created on first access).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { type: string }
        "401":
          description: Unauthorized
  /v1/me/watchlist/{id}:
    put:
      summary: Add an item to the default list (back-compat alias)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Added (or already present)
    delete:
      summary: Remove an item from the default list (back-compat alias)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed (or already absent)
  /v1/items/{id}/play/info:
    get:
      summary: How the item plays for this client, and the qualities it may pick
      description: >
        Proxied from chino-stream. For a packaged title (mode "packaged")
        the video fields are the rung the client starts on, qualities lists
        Auto and the packaged rungs it may pick (null when there are fewer
        than two), and default_quality is "auto". Send the caps the master
        request sends. For an on-the-fly title (mode transcode / remux /
        passthrough) qualities is high/medium/low (transcode only) or null.
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - $ref: "#/components/parameters/Caps"
        - $ref: "#/components/parameters/Quality"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayInfo" }
        "404":
          description: No playback asset for the item
  /v1/items/{id}/play/master.m3u8:
    get:
      summary: The HLS master the client plays
      description: >
        A packaged title's master as this client is served it: one codec
        family (the HEVC rungs when it decodes HEVC and one fits its HEVC
        height cap, else the H.264 rungs), no rung over its cap for that
        codec, the audio groups it decodes (stereo AAC always, the E-AC-3
        5.1 group only with eac3, an AC-3 one only with ac3), the SUBTITLES
        group when the package has one, exactly one DEFAULT=YES per audio
        group. q=<rung id> serves that rung alone. A package with one video
        rendition and one audio group is served as packaged. Without a
        package, or for a client that decodes none of its rungs, the
        on-the-fly master (q=high|medium|low). Every URI in it carries the
        request's query, so the stream token authorises each fetch.
        Fetching it warms the variant the client starts on (with t, from
        there).
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - $ref: "#/components/parameters/Caps"
        - $ref: "#/components/parameters/Quality"
        - $ref: "#/components/parameters/StartSeconds"
      responses:
        "200":
          description: The master playlist
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
        "404":
          description: No playback asset for the item
  /v1/items/{id}/play/prewarm:
    post:
      summary: Warm the start of a title before it plays
      description: >
        Answers at once; the warm runs in the background. A packaged title
        warms the variant the client will start on for its caps and q
        (playlist, init and the segments from t, else the first ones); an
        on-the-fly one its first window.
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - $ref: "#/components/parameters/Caps"
        - $ref: "#/components/parameters/Quality"
        - $ref: "#/components/parameters/StartSeconds"
      responses:
        "202":
          description: Warming ("packaged-warming" or "warming")
  /v1/items/{id}/play/{rendition}/playlist.m3u8:
    get:
      summary: A packaged rendition's media playlist
      description: vN video, aN audio, sN WebVTT subtitles (the URIs a master names).
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - in: path
          name: rendition
          required: true
          schema: { type: string, pattern: "^[vas][0-9]+$" }
      responses:
        "200":
          description: The media playlist; its URIs carry the request's query
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
        "404":
          description: No such rendition
  /v1/items/{id}/play/{rendition}/init.mp4:
    get:
      summary: A packaged video or audio rendition's init segment
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - in: path
          name: rendition
          required: true
          schema: { type: string, pattern: "^[va][0-9]+$" }
      responses:
        "200":
          description: init.mp4
          content:
            video/mp4:
              schema: { type: string, format: binary }
  /v1/items/{id}/play/{rendition}/seg-{n}.m4s:
    get:
      summary: A packaged video or audio media segment (ranges accepted)
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - in: path
          name: rendition
          required: true
          schema: { type: string, pattern: "^[va][0-9]+$" }
        - in: path
          name: n
          required: true
          schema: { type: string, pattern: "^[0-9]+$", example: "00001" }
      responses:
        "200":
          description: The segment
          content:
            video/iso.segment:
              schema: { type: string, format: binary }
  /v1/items/{id}/play/{rendition}/seg-{n}.vtt:
    get:
      summary: A packaged WebVTT subtitle segment (ranges accepted)
      description: >
        Of an sN rendition, what a master's TYPE=SUBTITLES group points at
        (the packager's HLS_SUBTITLES).
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - in: path
          name: rendition
          required: true
          schema: { type: string, pattern: "^s[0-9]+$" }
        - in: path
          name: n
          required: true
          schema: { type: string, pattern: "^[0-9]+$", example: "00001" }
      responses:
        "200":
          description: The segment
          content:
            text/vtt:
              schema: { type: string }
  /v1/items/{id}/play/{rendition}/iframes.m3u8:
    get:
      summary: A packaged video rung's I-frame playlist (trick play)
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - in: path
          name: rendition
          required: true
          schema: { type: string, pattern: "^v[0-9]+$" }
      responses:
        "200":
          description: The I-frame playlist
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
  /v1/items/{id}/extras/{extraId}/play/master.m3u8:
    get:
      summary: The HLS master of one of a title's extras (its play_path)
      description: >
        An extra the item detail lists (a trailer, a teaser, a featurette, …)
        plays from a package of its own, under its title's id. The master as
        this client is served it, by the rules of a packaged title's master
        (caps; q=<rung id> for one rung), every URI in it carrying the
        request's query, so the stream token authorises each fetch. An extra
        is packaged HEVC only, as a title is: a client that decodes none of
        its rungs is served the on-the-fly master, transcoded from the
        package, whose rung and audio tracks play under the extra's
        {high|medium|low}/index.m3u8, init.mp4, {n}.m4s and
        audio/{n}/index.m3u8, init.mp4, {n}.m4s. 404 for a title the viewer's
        rating cap does not allow, as on every route of the title, and for an
        extra that is not the title's or not packaged. An extra has no
        progress, watched, segments, trickplay, /play/info or /play/prewarm.
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - $ref: "#/components/parameters/ExtraID"
        - $ref: "#/components/parameters/Caps"
        - in: query
          name: q
          description: auto (default), or a rung id the master names (v0, v1) for that rung alone; on the on-the-fly master high, medium or low.
          schema: { type: string, example: v1 }
      responses:
        "200":
          description: The master playlist
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
        "404":
          description: No such extra of the title, or a title the viewer's rating cap does not allow
  /v1/items/{id}/extras/{extraId}/play/{rendition}/playlist.m3u8:
    get:
      summary: A media playlist of an extra's rendition
      description: vN video, aN audio, sN WebVTT subtitles (the URIs its master names).
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - $ref: "#/components/parameters/ExtraID"
        - in: path
          name: rendition
          required: true
          schema: { type: string, pattern: "^[vas][0-9]+$" }
      responses:
        "200":
          description: The media playlist; its URIs carry the request's query
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
        "404":
          description: No such rendition or extra of the title
  /v1/items/{id}/extras/{extraId}/play/{rendition}/init.mp4:
    get:
      summary: The init segment of an extra's video or audio rendition
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - $ref: "#/components/parameters/ExtraID"
        - in: path
          name: rendition
          required: true
          schema: { type: string, pattern: "^[va][0-9]+$" }
      responses:
        "200":
          description: init.mp4
          content:
            video/mp4:
              schema: { type: string, format: binary }
  /v1/items/{id}/extras/{extraId}/play/{rendition}/seg-{n}.m4s:
    get:
      summary: A media segment of an extra's video or audio rendition (ranges accepted)
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - $ref: "#/components/parameters/ExtraID"
        - in: path
          name: rendition
          required: true
          schema: { type: string, pattern: "^[va][0-9]+$" }
        - in: path
          name: n
          required: true
          schema: { type: string, pattern: "^[0-9]+$", example: "00001" }
      responses:
        "200":
          description: The segment
          content:
            video/iso.segment:
              schema: { type: string, format: binary }
  /v1/items/{id}/extras/{extraId}/play/{rendition}/seg-{n}.vtt:
    get:
      summary: A WebVTT segment of an extra's subtitle rendition (ranges accepted)
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - $ref: "#/components/parameters/ExtraID"
        - in: path
          name: rendition
          required: true
          schema: { type: string, pattern: "^s[0-9]+$" }
        - in: path
          name: n
          required: true
          schema: { type: string, pattern: "^[0-9]+$", example: "00001" }
      responses:
        "200":
          description: The segment
          content:
            text/vtt:
              schema: { type: string }
  /v1/items/{id}/extras/{extraId}/play/{rendition}/iframes.m3u8:
    get:
      summary: The I-frame playlist of an extra's video rung
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - $ref: "#/components/parameters/ExtraID"
        - in: path
          name: rendition
          required: true
          schema: { type: string, pattern: "^v[0-9]+$" }
      responses:
        "200":
          description: The I-frame playlist
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
  /v1/notices:
    get:
      summary: The signed-in person's notices — what addons told them — newest first
      description: >-
        Read from portal-api (GET /api/portal/me/notices) with the person's
        bearer; chino-api keeps nothing of them. Best effort: with no
        portal-api, or one that does not answer as it does, the list is
        empty and available false, and the answer still 200 — a home screen
        that shows notices never fails for them. A notice is its addon's
        plain text: a client shows it as text and never as markup, follows
        its link only to its own server, and opens its itemId with the item
        routes, which hold a capped viewer to their cap.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The person's notices, how many are unread, and whether portal-api answered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoticeList" }
        "401":
          description: No bearer, or one that is not valid (a stream token is not taken)
  /v1/notices/{noticeId}/read:
    post:
      summary: Mark one of the person's notices read
      description: Forwarded to portal-api (POST /api/portal/me/notices/{noticeId}/read) with the person's bearer.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/NoticeID"
      responses:
        "200":
          description: Read — once; reading it again keeps when it was first read
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: { type: integer, description: "How many of the person's notices are unread still" }
        "401":
          description: No bearer, or one that is not valid
        "404":
          $ref: "#/components/responses/NoNotice"
        "502":
          $ref: "#/components/responses/NoticesUnavailable"
        "503":
          $ref: "#/components/responses/NoticesUnavailable"
  /v1/notices/read-all:
    post:
      summary: Mark every notice of the person read
      description: Forwarded to portal-api (POST /api/portal/me/notices/read-all) with the person's bearer.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Read
          content:
            application/json:
              schema:
                type: object
                properties:
                  read: { type: integer, description: How many it marked }
                  unread: { type: integer, enum: [0] }
        "401":
          description: No bearer, or one that is not valid
        "502":
          $ref: "#/components/responses/NoticesUnavailable"
        "503":
          $ref: "#/components/responses/NoticesUnavailable"
  /v1/notices/{noticeId}:
    delete:
      summary: Delete one of the person's notices
      description: Forwarded to portal-api (DELETE /api/portal/me/notices/{noticeId}) with the person's bearer.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/NoticeID"
      responses:
        "204":
          description: Deleted
        "401":
          description: No bearer, or one that is not valid
        "404":
          $ref: "#/components/responses/NoNotice"
        "502":
          $ref: "#/components/responses/NoticesUnavailable"
        "503":
          $ref: "#/components/responses/NoticesUnavailable"
  /v1/feedback:
    post:
      summary: Submit a bug / feedback report (becomes an OpenProject ticket)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [report]
              properties:
                report:
                  type: object
                  required: [source, kind, description]
                  properties:
                    source: { type: string, enum: [web, mobile, tv] }
                    kind: { type: string, enum: [manual, error, crash, player] }
                    title: { type: string }
                    description: { type: string }
                    fingerprint:
                      type: string
                      description: lowercase hex sha-256 of the normalized error signature; omit for manual reports
                    context:
                      type: object
                      additionalProperties: { type: string }
                screenshot:
                  type: string
                  format: binary
                  description: image/png or image/jpeg, max 3 MB
      responses:
        "200":
          description: Deduplicated — comment appended to the existing ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  url: { type: string }
                  duplicate: { type: boolean }
        "201":
          description: New ticket created (same body shape, duplicate=false)
        "400":
          description: Invalid report (bad enum, empty description, oversized or non-png/jpeg screenshot)
        "401":
          description: Unauthorized
        "429":
          description: Rate limited (5 reports / 10 min per user)
        "503":
          description: Feedback pipeline not configured (no OpenProject token)
  /v1/admin/items/{id}/package:
    description: >-
      An admin's: the bearer must carry the admin role in its realm roles
      (realm_access.roles; zaentrum-admin unless ADMIN_ROLE names another).
      Both methods are forwarded to katalog-manager with the bearer, which
      checks it again, and its answer comes back as it is. A stream token is
      not taken.
    parameters:
      - $ref: "#/components/parameters/ItemID"
    post:
      summary: Package an item (katalog-manager's POST /api/items/{id}/package)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: >-
            The packaging is enqueued, or already under way: a movie's or an
            episode's status, alreadyActive and message; a series' episodes
            enqueued of its episodes, and message
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  alreadyActive: { type: boolean }
                  episodesEnqueued: { type: integer }
                  episodesTotal: { type: integer }
                  message: { type: string }
        "400":
          description: The item cannot be packaged (not a movie, an episode or a series)
        "401":
          description: No bearer, or one that is not valid
        "403":
          description: The bearer does not carry the admin role
        "404":
          description: No such item
        "502":
          description: katalog-manager did not answer
        "503":
          description: No katalog-manager configured (KATALOG_MANAGER_URL)
    get:
      summary: An item's processing steps, to watch its packaging (katalog-manager's GET /api/analyze/items/{id}/steps)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The item's steps by name, each with its status
          content:
            application/json:
              schema:
                type: object
                properties:
                  itemId: { type: string }
                  steps:
                    type: object
                    additionalProperties: { type: string }
                    example: { transcode: done, package: in_progress }
        "401":
          description: No bearer, or one that is not valid
        "403":
          description: The bearer does not carry the admin role
        "502":
          description: katalog-manager did not answer
        "503":
          description: No katalog-manager configured (KATALOG_MANAGER_URL)
  /v1/admin/accounts/{sub}/data:
    delete:
      summary: Delete what chino keeps of an account an admin deletes (for portal-api)
      description: >-
        portal-api calls it when an admin deletes someone on the People page,
        before it deletes their account: the admin's bearer, carrying the
        admin role, and the account deletion token. Deleting an account
        chino keeps nothing of is no error.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: sub
          required: true
          description: The account's subject (its id in the platform's realm)
          schema: { type: string }
        - $ref: "#/components/parameters/DeletionToken"
      responses:
        "200":
          description: The account's data, deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { $ref: "#/components/schemas/DeletedData" }
        "401":
          description: No bearer, or one that is not valid
        "403":
          description: The bearer does not carry the admin role, or the deletion token is missing or wrong
        "501":
          description: Account deletion is not set up (no ACCOUNT_DELETION_TOKEN)
components:
  parameters:
    DeletionToken:
      in: header
      name: X-Account-Deletion-Token
      required: true
      description: >-
        The account deletion token chino-api and portal-api share
        (ACCOUNT_DELETION_TOKEN): the call comes from the service that
        deletes the account, and from no client.
      schema: { type: string }
    ItemID:
      in: path
      name: id
      required: true
      description: >
        A title's id. A capped viewer gets 404 for a title its cap does not
        allow, as for an id of no title.
      schema: { type: string }
    ExtraID:
      in: path
      name: extraId
      required: true
      description: >
        The id of one of the title's extras, as the item detail lists it (a
        UUID). Anything else is 404, and goes nowhere; so is an extra of
        another title.
      schema: { type: string, format: uuid }
    Caps:
      in: query
      name: caps
      description: >
        What the client decodes, comma-separated: video avc, hvc, av1, vp9,
        each with an optional ":<height>" (the hardware decoder's tallest
        frame, e.g. hvc:1080); audio aac, mp3, opus, vorbis, ac3, eac3;
        aacmc for AAC beyond two channels. Without it: H.264, VP9, AV1,
        AAC, MP3, Opus, Vorbis — no HEVC.
      schema: { type: string, example: "avc:2160,hvc:2160,aac,eac3" }
    Quality:
      in: query
      name: q
      description: >
        auto (default) or the name of an entry of /play/info's qualities.
        On an on-the-fly title high, medium or low; on a packaged title
        those mean auto.
      schema: { type: string, example: "v1" }
    StartSeconds:
      in: query
      name: t
      description: Seconds into the title the client starts at; what is warmed from.
      schema: { type: number, minimum: 0 }
    NoticeID:
      in: path
      name: noticeId
      required: true
      description: >
        A notice's id, as GET /api/v1/notices lists it: letters, digits and
        dashes (portal-api's are UUIDs). Anything else is 404, and goes
        nowhere.
      schema: { type: string, pattern: "^[A-Za-z0-9-]{1,64}$" }
  responses:
    NoNotice:
      description: The person has no notice of that id — someone else's is as one there is not
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NoticeRefusal" }
    NoticesUnavailable:
      description: >-
        portal-api did not change the notice — 502: it did not answer, or not
        as it does; 503: this server has none configured. The app keeps the
        notice as it was.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NoticeRefusal" }
  schemas:
    Notice:
      type: object
      required: [id, addon, addonTitle, title, body, link, itemId, createdAt, readAt]
      description: >
        What an addon told the person, as portal-api keeps it. Plain text,
        shown as text: a title of at most 80 characters, a body of at most
        280 that may hold line breaks.
      properties:
        id: { type: string, example: 3f2b9c1e-0b7a-4c55-9d1e-2a4f6b8c0d1e }
        addon: { type: string, description: "The addon's key", example: example }
        addonTitle: { type: string, description: "The addon's app title: whom the notice is from", example: Example }
        addonIcon: { type: string, description: "The addon's app icon, a lucide name; '' for none", example: puzzle }
        title: { type: string, maxLength: 80 }
        body: { type: string, maxLength: 280 }
        link:
          type: string
          description: >
            '' for none; else a path on the server, or an absolute http(s)
            URL on its own origin — portal-api checks it as it checks a slot
            row's link. A client follows it only to its own server.
        itemId:
          type: string
          description: "'' for none; else a title's id, opened with the item routes"
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true, description: null while unread }
    NoticeList:
      type: object
      required: [notices, unread, available]
      properties:
        notices:
          type: array
          description: Newest first; the person keeps their newest 100
          items: { $ref: "#/components/schemas/Notice" }
        unread: { type: integer }
        available:
          type: boolean
          description: false when no portal-api answered — the list is empty then, and says nothing about the person's notices
    NoticeRefusal:
      type: object
      properties:
        error: { type: string, enum: [not_found, notices_unavailable] }
        message: { type: string, description: For the person }
    DeletedData:
      type: object
      description: How many rows of each kind were deleted.
      properties:
        progress: { type: integer }
        watched: { type: integer }
        watchlists: { type: integer }
        watchlistItems: { type: integer }
        likes: { type: integer }
        legacyWatchlist: { type: integer }
    AccountRefusal:
      type: object
      properties:
        error: { type: string, enum: [refused, account_not_deleted, account_deletion_unavailable, data_not_deleted, bearer_in_url] }
        message: { type: string, description: For the person }
    PlayInfo:
      type: object
      description: Every field but mode is omitted or null where it does not apply.
      properties:
        mode: { type: string, enum: [packaged, transcode, remux, passthrough] }
        reason: { type: string }
        filename: { type: string }
        container: { type: string }
        video_codec:
          type: string
          description: packaged — the CODECS entry of the rung the client starts on
        audio_codec: { type: string }
        width: { type: integer }
        height: { type: integer }
        duration_ms: { type: integer }
        encoder: { type: string, description: "on the fly: libx264 or h264_nvenc" }
        qualities:
          type: array
          nullable: true
          description: >
            packaged: Auto first, then one entry per picture size the client
            decodes at its heights, tallest first (null when fewer than two
            rungs to pick from); transcode: high, medium, low. A menu shows
            them by label and reloads the master with q=<name>.
          items: { $ref: "#/components/schemas/PlayQuality" }
        default_quality: { type: string, description: "packaged: auto; transcode: high" }
        audio_tracks:
          type: array
          description: packaged — the stereo tracks
          items: { type: object }
        subtitle_tracks:
          type: array
          description: packaged — the sidecars, a WebVTT one with its HLS rendition dir (hls)
          items: { type: object }
    PlayQuality:
      type: object
      required: [name, label]
      properties:
        name: { type: string, description: "the q value: auto, a rung id (v1) or high/medium/low", example: v1 }
        label: { type: string, example: 720p }
        id: { type: string, description: "packaged rungs: the rung id", example: v1 }
        width: { type: integer, example: 1280 }
        height: { type: integer, example: 720 }
        codec: { type: string, example: avc1.64001f }
        bitrate: { type: integer, description: "bit/s, the variant's BANDWIDTH", example: 1505267 }
        video_range: { type: string, enum: [SDR, PQ, HLG] }
    Item:
      type: object
      description: The fields a detail page uses; others are omitted here.
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        year: { type: integer }
        poster_url: { type: string }
        backdrop_url: { type: string }
        min_age:
          type: integer
          minimum: 0
          maximum: 21
          description: >
            The age a viewer must be to be served the title: an admin's rating,
            else (an episode) its series', else the minimum age its
            certification means; omitted when nothing rates it, 0 sent.
        certification:
          type: string
          description: >
            The certification the age comes from, as TMDB gives it in its
            country ("12" in DE is FSK 12); omitted when an admin rated the
            title by hand, or nothing rates it.
          example: PG-13
        certification_country:
          type: string
          description: The certification's country, ISO 3166-1 alpha-2.
          example: US
        coveredBy:
          type: string
          description: >
            On an episode whose file is another's (one file that holds several
            episodes, a double-length finale listed as two): the id of the
            episode that holds the file, its holder, the first of them. It
            plays the holder's package. The viewer's progress and watched
            state are the file's: a write for any of its episodes is written
            for each, and the next episode is the one after the file's last.
            Omitted on every other item, as the catalog's name for it.
        covers:
          type: array
          items: { type: string }
          description: >
            On the holder of a file that holds several episodes: the ids of
            the others, in episode order. Omitted on every other item.
        episodeEnd:
          type: integer
          description: >
            On the holder of a file that holds several episodes: the last
            episode number the file holds; a client can show the holder as
            E15–16, from its episode number to episodeEnd. Omitted on every
            other item.
          example: 16
        genres:
          type: array
          items: { type: string }
        cast:
          description: >
            As the catalog orders and caps it: role by role (actor, creator,
            director, writer, producer, composer, cinematographer, editor,
            then any other role alphabetically), billing order within a role;
            at most 20 actors and 10 people of every other role.
          type: array
          items: { $ref: "#/components/schemas/CastEntry" }
        trailers:
          description: >
            The title's links to online videos, as the catalog has them: each
            with its url, which a client opens outside the app. Nothing else
            is in it (a trailer this server plays is in extras). Omitted when
            there is none.
          type: array
          items: { $ref: "#/components/schemas/Trailer" }
        extras:
          description: >
            On a movie or a series: its extras that play here (a trailer, a
            teaser, a featurette, …, each a file of its own, packaged for
            streaming), in the order a viewer sees them, each at its
            play_path. Omitted when none plays, and while the catalog has no
            extras yet.
          type: array
          items: { $ref: "#/components/schemas/Extra" }
        roles:
          description: on a person's filmography only, the person's roles on the item
          type: array
          items: { type: string }
        watched_at: { type: string, format: date-time }
    Trailer:
      type: object
      required: [url]
      description: A link to an online video of the title; every optional field is omitted when unknown.
      properties:
        site: { type: string, description: "the site the video is on", example: YouTube }
        external_id: { type: string, description: "the video's id there" }
        url: { type: string, description: "always sent; a client opens it outside the app" }
        title: { type: string }
    Extra:
      type: object
      required: [id, kind, title, local, play_path]
      description: One extra of a movie or a series that plays here; every optional field is omitted when unknown.
      properties:
        id: { type: string, format: uuid, example: 1b5c2a8e-6f0d-4c3e-9a51-2d7f0c4b8e01 }
        kind:
          type: string
          description: >
            One of trailer, teaser, featurette, behind-the-scenes, making-of,
            deleted-scene, interview, gag-reel, short, other. A client may
            skip kinds it does not know.
          example: trailer
        title:
          type: string
          description: What a viewer sees, its label when one is set (nothing sets one yet) else the title the extra was taken in with
          example: Trailer
        language: { type: string, description: "the language spoken in it, as taken in: BCP 47 or ISO 639-2 (en, eng; zxx none)", example: en }
        duration_ms: { type: integer, example: 33000 }
        season_number:
          type: integer
          minimum: 0
          description: On a series' extra of one season only, that season (0 the specials)
        local:
          type: boolean
          description: Always true; the extra plays from this server (a link to elsewhere is a trailer)
        play_path:
          type: string
          description: >
            Its HLS master on this server, asked for as a title's master is:
            with ?stream=<a stream token> and &caps=<what the client decodes>.
          example: /api/v1/items/9c4e7a12-3b5d-4f60-8a91-0e2d4c6b8f13/extras/1b5c2a8e-6f0d-4c3e-9a51-2d7f0c4b8e01/play/master.m3u8
    CastEntry:
      type: object
      required: [name, role]
      description: One credit; every optional field is omitted when unknown.
      properties:
        person_id: { type: string }
        name: { type: string }
        role:
          type: string
          description: open vocabulary; a client shows the roles it knows
        job: { type: string, example: Screenplay }
        character: { type: string }
        order: { type: integer, minimum: 0, description: "billing order within the role, 0 first" }
        episode_count: { type: integer }
    Person:
      type: object
      required: [id, name, has_profile]
      properties:
        id: { type: string }
        name: { type: string }
        credits: { type: integer, description: "search results: the number of titles" }
        has_profile: { type: boolean }
        profile_url:
          type: string
          description: set when has_profile; /api/v1/people/{id}/profile
    PersonDetail:
      allOf:
        - $ref: "#/components/schemas/Person"
        - type: object
          description: Every optional field is omitted when unknown.
          properties:
            sort_name: { type: string }
            also_known_as:
              type: array
              items: { type: string }
            birth_date: { type: string, format: date }
            death_date: { type: string, format: date }
            birthplace: { type: string }
            known_for_department: { type: string }
            biography: { type: string }
            biography_lang: { type: string, description: "a primary language subtag" }
            tmdb_person_id: { type: string }
            imdb_id: { type: string }
            items:
              type: array
              items: { $ref: "#/components/schemas/Item" }
    Watchlist:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        itemCount: { type: integer }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    streamToken:
      type: apiKey
      in: query
      name: stream
      description: >
        a stream token from POST /api/v1/me/stream-token; a capped viewer's
        carries its cap, signed with the rest
