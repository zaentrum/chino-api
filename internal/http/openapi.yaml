openapi: 3.0.3
info:
  title: chino-api
  version: 0.1.0
  description: |
    Backend API for the chino product of the zaentrum platform.

    A viewer whose access token carries `max_rating`, a whole number of years
    (a kid's account), is capped at that age; a claim that is no whole number
    of years is the strictest cap, 0, and a token without it is not capped.
    A capped viewer is served only the titles the catalog rates at most its
    cap (an episode as its series, unless an admin rated it), and the unrated
    ones only when the catalog's setting `ratings.unrated_for_capped` says
    show. A title it may not be served is as one there is not: every route of
    one title answers it 404 "not found", with its bearer and with its stream
    token (which carries the cap of the bearer it was minted with), and the
    lists (browse, search, people, continue watching, history, watchlists,
    likes, the Zap feeds) leave it out. chino-api passes the cap on to the
    catalog with every request.

    What failed is logged on the server; the caller gets a fixed line that
    says what it cannot have, never the error's text. katalog-api failing a
    route is 502 "catalog unavailable", as plain text, or as the code of the
    lists and search ({product, error, detail}). Where the media routes'
    upstream does not answer, 502 "playback unavailable" (chino-stream) or
    "artwork unavailable" (katalog-manager); its error answer keeps its
    status, with that line for 500 or more and the status's words below, as
    plain text, and of its headers Retry-After and Content-Range alone, in
    their own syntax; its answer below 400 goes on with its body and the
    headers a player needs (nosniff, and a type only as one the media routes
    serve, any other or none as application/octet-stream); one it breaks off
    is that 502 where none of it has gone out yet, and cut off for the caller
    where bytes of it have; a redirect of an upstream is not followed, and
    goes on as its status without its Location; an
    admin's packaging that katalog-manager does not answer, 502 "packaging
    unavailable"; a bug report OpenProject does not take, 502 "bug reports
    unavailable". A bearer that does not verify is 401 "invalid token", and
    one made for another audience 401 "invalid token: wrong audience".

    A route that answers its read or write of chino-api's database failing
    answers 500 "database error", as plain text, whatever the error. Account
    deletion answers its own 500s (DELETE /v1/me: data_not_deleted;
    DELETE /v1/admin/accounts/{sub}/data: a line of text). Where a read of
    the database only adds to an answer (the viewer's watched_at on the
    titles listed, the episode last watched that next-episode goes on from,
    which episodes after a finished one are watched and the next one's
    resume point on Continue Watching), a failure leaves that out, and the
    route answers as without it. A request whose viewer goes before the
    database or an upstream has answered is answered as one that failed.

    Once an account's deletion has begun (DELETE /v1/me, or an admin's
    DELETE /v1/admin/accounts/{sub}/data), nothing more is kept for it. That
    holds for every write of the person's - one that adds, removes or
    renames, a PATCH of the settings that changes nothing, a read of the
    lists, which makes the default one - and for a bug report and a new
    stream token. One sent while the deletion is open waits for its end, up
    to 3 seconds, past which it answers 503 "account busy" with Retry-After:
    5; once the deletion is committed, that one and any after it with a
    bearer still valid answer 401 account_deleted ({error, detail}, no
    values), and the app signs the account out. Reads answer as before, and
    a stream token minted before runs out by itself. The account's id is
    kept an hour for this, longer than a sign-in's token lives, and nothing
    else of it; a deletion that is rolled back keeps none, and the waiting
    write is written. Once portal-api has deleted the account, the deletion
    ends even where the app goes before its answer; where portal-api gives
    no answer, or a 5xx, it is asked once more, and a 4xx is not asked
    again. Where portal-api cannot delete the
    account after an admin's deletion of its data, it is to have the
    deletion forgotten (DELETE /v1/admin/accounts/{sub}/deleted, with the
    deletion's value /data answered), and the person then writes again at
    once; until it does, they cannot write for up to the hour.
servers:
  - url: /api
paths:
  /healthz:
    get:
      summary: Liveness / readiness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  product: { type: string }
  /config:
    get:
      summary: What a client needs to know of this server before it signs in
      description: >-
        Holding nothing secret: it asks for no bearer, any origin may read it
        (Access-Control-Allow-Origin: *), and it may be cached for 5 minutes:
        by any cache where PUBLIC_BASE_URL is set (Cache-Control: public,
        max-age=300), else, apiBase being the request's own, by the caller's
        alone (private, max-age=300).
        A client that knows only the server's address reads here the
        identity provider to sign in with, the public client id of its
        platform, and what the server offers (features).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppConfig" }
  /v1/me:
    get:
      summary: Echo the caller's OIDC subject
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
    delete:
      summary: Delete the signed-in person's data and their account
      description: >-
        Deletes what chino-api keeps of the person (playback progress, watch
        history, named watchlists and their items, likes, the settings their
        account keeps) and asks
        portal-api, with the person's bearer and the account deletion token,
        to delete their account (DELETE /api/portal/me). The rows are deleted
        in a transaction committed only once the account is deleted or gone
        already; when portal-api refuses or does not answer, nothing is
        deleted. Once it has begun, nothing more is kept for the person: a
        write for them answers 401 account_deleted (see above). The bearer
        goes in the Authorization header: a stream token is not taken, and a
        bearer in ?token= is refused.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The data deleted, and the account deleted (account deleted) or found gone already (account gone)
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { type: string, enum: [deleted, gone] }
                  deleted: { $ref: "#/components/schemas/DeletedData" }
        "400":
          description: The bearer was sent in the URL (?token=)
        "401":
          description: No bearer, or one that is not valid
        "409":
          description: >-
            portal-api refuses: the person is the last admin, or an
            administrator of Keycloak itself. Nothing is deleted; message
            says why, for the person.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountRefusal" }
        "501":
          description: >-
            Account deletion is not set up (no ACCOUNT_DELETION_TOKEN):
            accounts live in an identity provider the platform does not
            manage. Nothing is deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountRefusal" }
        "502":
          description: portal-api did not delete the account; nothing is deleted, and asking again starts over
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountRefusal" }
  /v1/me/settings:
    get:
      summary: The settings the signed-in person's account keeps
      description: >-
        The settings that go with the account to every device it signs in
        on, in one store, kept by the account's subject and deleted with its
        data (DELETE /api/v1/me). It answers the fields it keeps, each at its
        first value while nothing is set.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401":
          description: No bearer, or one that is not valid
    patch:
      summary: Change settings of the signed-in person's account
      description: >-
        Sets each field the body names and leaves the others as they are;
        null puts a field back to its first value. A request that is refused
        changes nothing: a field beside the refused one is not saved either.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsChange" }
      responses:
        "200":
          description: The settings as kept
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400":
          description: >-
            Refused, and nothing changed. setting_unknown: a field the store
            does not keep, named in values.name (the first such field, in the
            order of their names). watchlist_by_kind_invalid: a value of
            watchlist_by_kind that is neither true, false nor null. A body
            that is no JSON object, names a field twice, has more than white
            space after the object, or is longer than 4096 bytes is answered
            "bad json", as plain text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingRefusal" }
              examples:
                setting_unknown:
                  value: { error: setting_unknown, values: { name: theme }, detail: the settings store keeps no such field }
                watchlist_by_kind_invalid:
                  value: { error: watchlist_by_kind_invalid, detail: "watchlist_by_kind takes true, false or null" }
            text/plain:
              schema: { type: string, example: bad json }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AccountBusy" }
        "404":
          description: >-
            A server without a database, which keeps nothing (its /api/config
            says features.watchlist_kinds false): "list not found", as plain
            text, as creating, renaming or deleting a list is answered there.
          content:
            text/plain:
              schema: { type: string, example: list not found }
  /v1/me/available:
    post:
      summary: Which of the titles a client keeps the viewer may watch now
      description: >-
        One request for a phone's downloads: it asks as the app starts and
        comes to the front, and before a download plays, and deletes the
        downloads the answer leaves out. A capped viewer is held to its cap
        as on every route of one title (a title above it, an unrated one the
        catalog's setting hides and an id of no title are left out); for a
        viewer without a cap the catalog decides - a title it holds. An
        answer that leaves out every id asked also says how many titles of
        the library the viewer may watch (titles): above 0, the empty answer
        is the library's word; 0 is a catalog that shows the viewer nothing
        (imported anew, reset), and a phone deletes nothing on it alone. When
        the catalog cannot say, the answer is 502 and no ids.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  maxItems: 500
                  items: { type: string }
      responses:
        "200":
          description: The ids asked about that the viewer may watch, in their order, each once
          content:
            application/json:
              schema:
                type: object
                properties:
                  ids:
                    type: array
                    items: { type: string }
                  titles:
                    type: integer
                    description: >-
                      With an answer that leaves out every id asked only: how
                      many titles of the library the viewer may watch now
        "400":
          description: No body, no JSON, or more than 500 ids
        "401":
          description: No bearer, or one that is not valid
        "502":
          description: The catalog could not say; nothing is answered
  /v1/items/{id}/progress:
    get:
      summary: The viewer's resume point of a title
      description: >-
        position_sec is 0 for a title never begun, and for a finished one
        (its last 5 % or 2 minutes), which then has finished true.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  position_sec: { type: integer }
                  finished: { type: boolean }
        "404":
          description: No such item, or one the viewer's rating cap does not allow
    post:
      summary: Save the viewer's position in a title
      description: >-
        Written for every episode of the file the title plays. A finished
        position marks the title watched, but with dismiss. With
        played_ms_ago - the position's age when it is sent, a position a
        phone kept without a connection - it is the position at now() minus
        that age, written only where the saved one is older, and a finished
        one marks watched only where it was written. Without it the position
        is now's, written over any.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position_sec]
              properties:
                position_sec: { type: integer }
                duration_sec: { type: integer }
                dismiss:
                  type: boolean
                  description: Taken off Continue Watching - saved at its end, not marked watched
                played_ms_ago:
                  type: integer
                  format: int64
                  description: How long before the request the position was played, in milliseconds; below 0 counts as 0
      responses:
        "204":
          description: Saved, or older than the saved position and so not written
        "400":
          description: No body, or no JSON
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AccountBusy" }
        "404":
          description: No such item, or one the viewer's rating cap does not allow
  /v1/items:
    get:
      summary: List items for this product (stub during beta)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
  /v1/items/{id}:
    get:
      summary: An item with its genres, cast, subtitles, trailers, extras and segments
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "404":
          description: No such item, or one the viewer's rating cap does not allow
        "502":
          description: The catalog failed
  /v1/search:
    get:
      summary: Search the catalog
      description: >
        One search of the catalog (katalog-api's): its titles, films, series
        and episodes, ranked together by how they match the query, best first,
        and the people whose names match it, ranked apart. A title and a name
        are read without case, accents or punctuation ("widows bay" finds
        "Widow's Bay", "leon" "Léon"), while typing ("wido"), with typos
        ("nevrland"); a plot only when no title matches. Each title says how it
        matched (match), with its poster and the viewer's watched_at as the
        lists send them; an episode names its series (with its poster, and
        whether the series matched by its own title too, so a client can show
        the two as one). A client that does not show episodes yet leaves
        episode out of types. A capped viewer is served what the cap allows.
        Against a katalog-api without the search, each type's list of the
        query comes one after the other, each of up to limit titles, and the
        people as /v1/people finds them, without a match.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: The query; a blank one finds nothing.
        - in: query
          name: types
          schema: { type: string, default: "movie,series,episode" }
          description: The types of title, comma separated; the parameter may repeat.
          example: movie,series
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
          description: How many titles.
        - in: query
          name: people
          schema: { type: integer, minimum: 0, maximum: 50, default: 12 }
          description: How many people; 0 looks for none.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, people]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }
                  people:
                    type: array
                    items: { $ref: "#/components/schemas/Person" }
                  product: { type: string, example: chino }
                  source: { type: string, example: katalog }
        "502":
          description: The catalog failed
  /v1/people:
    get:
      summary: Search people by name
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: empty answers an empty list
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  people:
                    type: array
                    items: { $ref: "#/components/schemas/Person" }
                  total: { type: integer }
        "502":
          description: The catalog failed
  /v1/people/{id}:
    get:
      summary: A person, their details and their filmography
      description: >
        The filmography is one card per title, newest first, each with the
        person's roles on it. The biography is in the language `lang` names,
        else the first of Accept-Language's the catalog has, else English,
        else any; the response varies on Accept-Language.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - in: query
          name: lang
          schema: { type: string }
          description: biography language (a language tag; its primary subtag counts)
        - in: header
          name: Accept-Language
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonDetail" }
        "404":
          description: No such person
        "502":
          description: The catalog failed
  /v1/people/{id}/profile:
    get:
      summary: A person's portrait (what profile_url points at)
      description: >
        Proxied from the catalog manager with the posters' auth: a bearer
        or ?stream= (a stream token), so an <img src> works (?token=, the
        bearer in the URL, is deprecated and goes in the next release). Range and
        If-None-Match pass through; so do the upstream's status and, below
        400, its headers (ETag, 304). Its error answer (404 for a person
        without a portrait) is the status with a line of chino-api's own.
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The image
          content:
            image/*:
              schema: { type: string, format: binary }
        "304":
          description: Not modified (If-None-Match matched the ETag)
        "404":
          description: The person has no portrait
  /v1/me/watchlists:
    get:
      summary: List the caller's named watchlists
      description: >-
        Default list first, then others by createdAt ascending. With
        include=counts, each list has counts, its titles by kind, which add
        up to its itemCount; the kinds are the catalog's, and a title whose
        kind the catalog did not say for the request is counted under series.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: include
          required: false
          schema: { type: string, example: counts }
          description: >-
            comma-separated, given once; counts adds each list's counts by
            kind. A token this server does not know is passed over.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  lists:
                    type: array
                    items: { $ref: "#/components/schemas/Watchlist" }
        "400":
          description: >-
            include given twice ("include is given once"), or a query that
            does not parse, a pair with a semicolon or a bad escape ("bad
            query"), as plain text
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AccountBusy" }
        "502":
          description: The catalog could not say what a capped viewer may be served, or, with include=counts, the kind of any of the titles
    post:
      summary: Create a new named watchlist
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watchlist" }
        "400":
          description: Empty / over-length name
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AccountBusy" }
        "409":
          description: Too many lists (max 50) or case-insensitive duplicate name
  /v1/me/watchlists/memberships:
    get:
      summary: Which of the caller's lists each item belongs to
      description: >
        Powers the add-to-list picker checkmarks and the card "saved" badge.
        Items not in any list may be omitted or map to an empty array.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: ids
          required: true
          schema: { type: string }
          description: comma-separated item ids (max ~100)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  memberships:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }
        "401":
          description: Unauthorized
  /v1/me/watchlists/{listId}:
    get:
      summary: A single list's metadata + item ids
      description: >-
        Items newest-added first. With kind, the items of that kind alone,
        in the same order: movie its movies; series everything else, its
        series, its episodes and any other kind, so that the two hold all of
        the list. The kinds are the catalog's; a title whose kind the catalog
        did not say for the request goes with series.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: listId
          required: true
          schema: { type: string }
        - in: query
          name: kind
          required: false
          schema: { type: string, enum: [movie, series] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  isDefault: { type: boolean }
                  items:
                    type: array
                    items: { type: string }
        "400":
          description: >-
            A kind that is neither movie nor series, or kind given twice
            ("kind is movie or series"), or a query that does not parse, a
            pair with a semicolon or a bad escape ("bad query"), as plain text
        "404":
          description: Not the caller's list
        "502":
          description: The catalog could not say what a capped viewer may be served, or, with kind, the kind of any of the titles
    patch:
      summary: Rename a list
      description: Renaming the default list keeps isDefault=true.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: listId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watchlist" }
        "400":
          description: Empty / over-length name
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AccountBusy" }
        "404":
          description: Not the caller's list
        "409":
          description: Case-insensitive duplicate name
    delete:
      summary: Delete a list (cascades its items)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: listId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AccountBusy" }
        "404":
          description: Not the caller's list
        "409":
          description: Cannot delete the default list
  /v1/me/watchlists/{listId}/items/{itemId}:
    put:
      summary: Add an item to a list (idempotent)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: listId
          required: true
          schema: { type: string }
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Added (or already present)
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AccountBusy" }
        "404":
          description: Not the caller's list
    delete:
      summary: Remove an item from a list (idempotent)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: listId
          required: true
          schema: { type: string }
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed (or already absent)
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AccountBusy" }
        "404":
          description: Not the caller's list
  /v1/me/watchlist:
    get:
      summary: The default list's item ids (back-compat alias)
      description: >
        Back-compat alias kept for already-installed mobile/TV builds. Now
        maps to the caller's default list (lazily created on first access).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AccountBusy" }
  /v1/me/watchlist/{id}:
    put:
      summary: Add an item to the default list (back-compat alias)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Added (or already present)
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AccountBusy" }
    delete:
      summary: Remove an item from the default list (back-compat alias)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed (or already absent)
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AccountBusy" }
  /v1/items/{id}/subtitles:
    get:
      summary: An item's sidecar subtitles, and the fonts its styled ones are drawn with
      description: >-
        The subtitles of the file the item plays, each at its URL. Every
        client plays an entry's url, in the format format names (a SubRip
        file is served as WebVTT, and listed so). A subtitle whose package
        keeps its styled original (an ASS or an SSA script) offers it beside
        that in styled, for a player that draws styles (a libass renderer);
        fonts are then the fonts of the package the script asks for by
        name, each at its URL. A title without them is listed as before:
        no styled field, no fonts field — nor fonts when none of its
        subtitles offers a styled original.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
      responses:
        "200":
          description: The subtitles; an empty list when the item has none
          content:
            application/json:
              schema:
                type: object
                required: [subtitles]
                properties:
                  subtitles:
                    type: array
                    items: { $ref: "#/components/schemas/SidecarSubtitle" }
                  fonts:
                    type: array
                    description: >-
                      The fonts of the package the item plays, in their
                      order. Omitted when the package carries none, and when
                      no subtitle of the list has styled.
                    items: { $ref: "#/components/schemas/Font" }
              example:
                subtitles:
                  - id: 3c1f5a2e-7b9d-4e0a-8c61-2f4b6d8e0a13
                    lang: en
                    label: English
                    format: webvtt
                    default: true
                    url: /api/v1/play/subs/3c1f5a2e-7b9d-4e0a-8c61-2f4b6d8e0a13.vtt
                    styled:
                      url: /api/v1/play/subs/3c1f5a2e-7b9d-4e0a-8c61-2f4b6d8e0a13.ass
                      format: ass
                fonts:
                  - id: 9b0e4c7a-1d2f-5e3a-8b4c-6d7e8f9a0b1c
                    format: ttf
                    names: [Example Sans, Example Sans Regular, ExampleSans-Regular]
                    url: /api/v1/play/fonts/9b0e4c7a-1d2f-5e3a-8b4c-6d7e8f9a0b1c.ttf
        "401":
          description: No bearer, or one that is not valid (a stream token is not taken)
        "404":
          description: No such item, or one the viewer's rating cap leaves out
        "502":
          description: katalog-api did not answer
  /v1/play/subs/{id}.vtt:
    get:
      summary: A sidecar subtitle's file, at the url of its entry (ranges accepted)
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: >-
            The file, in the format its entry names: WebVTT (a SubRip file
            converted), or a bitmap subtitle's own container
          content:
            text/vtt:
              schema: { type: string }
            application/pgs:
              schema: { type: string, format: binary }
            application/x-vobsub:
              schema: { type: string, format: binary }
            application/dvb-subtitles:
              schema: { type: string, format: binary }
        "401":
          description: No credential, or one that is not valid
        "404":
          description: No such subtitle, or one of a title the viewer's rating cap leaves out
        "502":
          description: The catalog or chino-stream did not answer
  /v1/play/subs/{id}.ass:
    get:
      summary: A subtitle's styled original, its ASS or SSA script, at the url of its styled
      description: >-
        The script as the package keeps it, byte for byte, for a player that
        draws styles; the fonts it names are the subtitles list's fonts.
        Cached by the browser alone (private), for good: a subtitle's id is
        new with every package.
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The script
          content:
            text/x-ssa:
              schema: { type: string }
        "401":
          description: No credential, or one that is not valid
        "404":
          description: >-
            No such subtitle, one without a styled original, or one of a title
            the viewer's rating cap leaves out
        "502":
          description: The catalog or chino-stream did not answer
  /v1/play/fonts/{id}.{ext}:
    get:
      summary: A font of the package an item plays, at the url of its entry
      description: >-
        Its MIME is its format's (font/ttf, font/otf, font/collection,
        font/woff, font/woff2; application/octet-stream for a font of none
        of them); the extension is the format, bin for none. Cached by the
        browser alone (private) for a day, then revalidated (ETag).
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: ext
          required: true
          schema: { type: string, enum: [ttf, otf, ttc, woff, woff2, bin] }
      responses:
        "200":
          description: The font file
          content:
            font/ttf:
              schema: { type: string, format: binary }
            font/otf:
              schema: { type: string, format: binary }
            font/collection:
              schema: { type: string, format: binary }
            font/woff:
              schema: { type: string, format: binary }
            font/woff2:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
        "304":
          description: Unchanged since the ETag sent in If-None-Match
        "401":
          description: No credential, or one that is not valid
        "404":
          description: No such font, or one of a title the viewer's rating cap leaves out
        "502":
          description: The catalog or chino-stream did not answer
  /v1/subtitles/languages:
    get:
      summary: The instance's subtitle languages
      description: >-
        The languages every title of the instance is to have a subtitle in,
        as katalog-manager's settings name them: BCP 47 tags as
        katalog-manager gives them, in the setting's order, and nothing else.
        They are the instance's, not the viewer's: chino-api asks
        katalog-manager (GET /api/library/subtitles/languages) with the
        viewer's bearer and keeps the answer for every viewer for 5 minutes,
        then asks again; when katalog-manager does not answer then, the last
        answer is served while it is less than an hour old. A stream token is
        not taken.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The languages, in the setting's order; empty when none is set
          content:
            application/json:
              schema:
                type: object
                required: [languages]
                properties:
                  languages:
                    type: array
                    items: { type: string, description: A BCP 47 language tag }
                    example: [en, de, zh-Hans]
        "401":
          description: No bearer, or one that is not valid (a stream token is not taken)
        "502":
          description: >-
            katalog-manager did not answer (an error, no answer within 5 s, a
            status other than 2xx, a body that is not its answer) and there is
            no answer of the last hour to serve. A line of text and no list;
            it says nothing of the setting.
  /v1/items/{id}/play/info:
    get:
      summary: How the item plays for this client, and the qualities it may pick
      description: >
        Proxied from chino-stream. For a packaged title (mode "packaged")
        the video fields are the rung the client starts on, qualities lists
        Auto and the packaged rungs it may pick (null when there are fewer
        than two), and default_quality is "auto". Send the caps the master
        request sends. For an on-the-fly title (mode transcode / remux /
        passthrough) qualities is high/medium/low (transcode only) or null.
        In every mode pictureArea says where the picture is in the frame
        served, where the catalog knows it.
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - $ref: "#/components/parameters/Caps"
        - $ref: "#/components/parameters/Quality"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayInfo" }
        "404":
          description: No playback asset for the item
  /v1/items/{id}/play/master.m3u8:
    get:
      summary: The HLS master the client plays
      description: >
        A packaged title's master as this client is served it: one codec
        family (the HEVC rungs when it decodes HEVC and one fits its HEVC
        height cap, else the H.264 rungs), no rung over its cap for that
        codec, the audio groups it decodes (stereo AAC always, the E-AC-3
        5.1 group only with eac3, an AC-3 one only with ac3), the SUBTITLES
        group when the package has one, exactly one DEFAULT=YES per audio
        group. q=<rung id> serves that rung alone. A package with one video
        rendition and one audio group is served as packaged. Without a
        package, or for a client that decodes none of its rungs, the
        on-the-fly master (q=high|medium|low). Every URI in it carries the
        request's query, so the stream token authorises each fetch.
        Fetching it warms the variant the client starts on (with t, from
        there).
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - $ref: "#/components/parameters/Caps"
        - $ref: "#/components/parameters/Quality"
        - $ref: "#/components/parameters/StartSeconds"
      responses:
        "200":
          description: The master playlist
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
        "404":
          description: No playback asset for the item
  /v1/items/{id}/play/prewarm:
    post:
      summary: Warm the start of a title before it plays
      description: >
        Answers at once; the warm runs in the background. A packaged title
        warms the variant the client will start on for its caps and q
        (playlist, init and the segments from t, else the first ones); an
        on-the-fly one its first window.
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - $ref: "#/components/parameters/Caps"
        - $ref: "#/components/parameters/Quality"
        - $ref: "#/components/parameters/StartSeconds"
      responses:
        "202":
          description: Warming ("packaged-warming" or "warming")
  /v1/items/{id}/play/{rendition}/playlist.m3u8:
    get:
      summary: A packaged rendition's media playlist
      description: vN video, aN audio, sN WebVTT subtitles (the URIs a master names).
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - in: path
          name: rendition
          required: true
          schema: { type: string, pattern: "^[vas][0-9]+$" }
      responses:
        "200":
          description: The media playlist; its URIs carry the request's query
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
        "404":
          description: No such rendition
  /v1/items/{id}/play/{rendition}/init.mp4:
    get:
      summary: A packaged video or audio rendition's init segment
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - in: path
          name: rendition
          required: true
          schema: { type: string, pattern: "^[va][0-9]+$" }
      responses:
        "200":
          description: init.mp4
          content:
            video/mp4:
              schema: { type: string, format: binary }
  /v1/items/{id}/play/{rendition}/seg-{n}.m4s:
    get:
      summary: A packaged video or audio media segment (ranges accepted)
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - in: path
          name: rendition
          required: true
          schema: { type: string, pattern: "^[va][0-9]+$" }
        - in: path
          name: n
          required: true
          schema: { type: string, pattern: "^[0-9]+$", example: "00001" }
      responses:
        "200":
          description: The segment
          content:
            video/iso.segment:
              schema: { type: string, format: binary }
  /v1/items/{id}/play/{rendition}/seg-{n}.vtt:
    get:
      summary: A packaged WebVTT subtitle segment (ranges accepted)
      description: >
        Of an sN rendition, what a master's TYPE=SUBTITLES group points at
        (the packager's HLS_SUBTITLES).
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - in: path
          name: rendition
          required: true
          schema: { type: string, pattern: "^s[0-9]+$" }
        - in: path
          name: n
          required: true
          schema: { type: string, pattern: "^[0-9]+$", example: "00001" }
      responses:
        "200":
          description: The segment
          content:
            text/vtt:
              schema: { type: string }
  /v1/items/{id}/play/{rendition}/iframes.m3u8:
    get:
      summary: A packaged video rung's I-frame playlist (trick play)
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - in: path
          name: rendition
          required: true
          schema: { type: string, pattern: "^v[0-9]+$" }
      responses:
        "200":
          description: The I-frame playlist
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
  /v1/items/{id}/extras/{extraId}/play/master.m3u8:
    get:
      summary: The HLS master of one of a title's extras (its play_path)
      description: >
        An extra the item detail lists (a trailer, a teaser, a featurette, …)
        plays from a package of its own, under its title's id. The master as
        this client is served it, by the rules of a packaged title's master
        (caps; q=<rung id> for one rung), every URI in it carrying the
        request's query, so the stream token authorises each fetch. An extra
        is packaged HEVC only, as a title is: a client that decodes none of
        its rungs is served the on-the-fly master, transcoded from the
        package, whose rung and audio tracks play under the extra's
        {high|medium|low}/index.m3u8, init.mp4, {n}.m4s and
        audio/{n}/index.m3u8, init.mp4, {n}.m4s. 404 for a title the viewer's
        rating cap does not allow, as on every route of the title, and for an
        extra that is not the title's or not packaged. An extra has no
        progress, watched, segments, trickplay or /play/prewarm; its
        /play/info says how it plays.
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - $ref: "#/components/parameters/ExtraID"
        - $ref: "#/components/parameters/Caps"
        - in: query
          name: q
          description: auto (default), or a rung id the master names (v0, v1) for that rung alone; on the on-the-fly master high, medium or low.
          schema: { type: string, example: v1 }
      responses:
        "200":
          description: The master playlist
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
        "404":
          description: No such extra of the title, or a title the viewer's rating cap does not allow
  /v1/items/{id}/extras/{extraId}/play/info:
    get:
      summary: How one of a title's extras plays for this client, and where its picture is
      description: >
        Proxied from chino-stream, as a title's /play/info, for the client
        the extra's master serves (send the caps and q the master request
        sends): mode "packaged" with the rung it starts on and the qualities
        it may pick, or for a client that decodes none of the extra's rungs
        the on-the-fly master's (mode transcode, qualities high, medium,
        low). pictureArea is the extra's own. 404 for a title the viewer's
        rating cap does not allow, as on every route of the title, and for
        an extra that is not the title's or not packaged.
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - $ref: "#/components/parameters/ExtraID"
        - $ref: "#/components/parameters/Caps"
        - in: query
          name: q
          description: auto (default), or a rung id the master names (v0, v1); on the on-the-fly master high, medium or low.
          schema: { type: string, example: v1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayInfo" }
        "404":
          description: No such extra of the title, or a title the viewer's rating cap does not allow
        "502":
          description: chino-stream could not learn from the catalog where the extra is
  /v1/items/{id}/extras/{extraId}/play/{rendition}/playlist.m3u8:
    get:
      summary: A media playlist of an extra's rendition
      description: vN video, aN audio, sN WebVTT subtitles (the URIs its master names).
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - $ref: "#/components/parameters/ExtraID"
        - in: path
          name: rendition
          required: true
          schema: { type: string, pattern: "^[vas][0-9]+$" }
      responses:
        "200":
          description: The media playlist; its URIs carry the request's query
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
        "404":
          description: No such rendition or extra of the title
  /v1/items/{id}/extras/{extraId}/play/{rendition}/init.mp4:
    get:
      summary: The init segment of an extra's video or audio rendition
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - $ref: "#/components/parameters/ExtraID"
        - in: path
          name: rendition
          required: true
          schema: { type: string, pattern: "^[va][0-9]+$" }
      responses:
        "200":
          description: init.mp4
          content:
            video/mp4:
              schema: { type: string, format: binary }
  /v1/items/{id}/extras/{extraId}/play/{rendition}/seg-{n}.m4s:
    get:
      summary: A media segment of an extra's video or audio rendition (ranges accepted)
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - $ref: "#/components/parameters/ExtraID"
        - in: path
          name: rendition
          required: true
          schema: { type: string, pattern: "^[va][0-9]+$" }
        - in: path
          name: n
          required: true
          schema: { type: string, pattern: "^[0-9]+$", example: "00001" }
      responses:
        "200":
          description: The segment
          content:
            video/iso.segment:
              schema: { type: string, format: binary }
  /v1/items/{id}/extras/{extraId}/play/{rendition}/seg-{n}.vtt:
    get:
      summary: A WebVTT segment of an extra's subtitle rendition (ranges accepted)
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - $ref: "#/components/parameters/ExtraID"
        - in: path
          name: rendition
          required: true
          schema: { type: string, pattern: "^s[0-9]+$" }
        - in: path
          name: n
          required: true
          schema: { type: string, pattern: "^[0-9]+$", example: "00001" }
      responses:
        "200":
          description: The segment
          content:
            text/vtt:
              schema: { type: string }
  /v1/items/{id}/extras/{extraId}/play/{rendition}/iframes.m3u8:
    get:
      summary: The I-frame playlist of an extra's video rung
      security: [{ bearerAuth: [] }, { streamToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - $ref: "#/components/parameters/ExtraID"
        - in: path
          name: rendition
          required: true
          schema: { type: string, pattern: "^v[0-9]+$" }
      responses:
        "200":
          description: The I-frame playlist
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
  /v1/notices:
    get:
      summary: The signed-in person's notices — what addons told them — newest first
      description: >-
        Read from portal-api (GET /api/portal/me/notices) with the person's
        bearer; chino-api keeps nothing of them. Best effort: with no
        portal-api, or one that does not answer as it does, the list is
        empty and available false, and the answer still 200 — a home screen
        that shows notices never fails for them. A notice is its addon's
        plain text: a client shows it as text and never as markup, follows
        its link only to its own server, and opens its itemId with the item
        routes, which hold a capped viewer to their cap.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The person's notices, how many are unread, and whether portal-api answered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoticeList" }
        "401":
          description: No bearer, or one that is not valid (a stream token is not taken)
  /v1/notices/{noticeId}/read:
    post:
      summary: Mark one of the person's notices read
      description: Forwarded to portal-api (POST /api/portal/me/notices/{noticeId}/read) with the person's bearer.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/NoticeID"
      responses:
        "200":
          description: Read — once; reading it again keeps when it was first read
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: { type: integer, description: "How many of the person's notices are unread still" }
        "401":
          description: No bearer, or one that is not valid
        "404":
          $ref: "#/components/responses/NoNotice"
        "502":
          $ref: "#/components/responses/NoticesUnavailable"
        "503":
          $ref: "#/components/responses/NoticesUnavailable"
  /v1/notices/read-all:
    post:
      summary: Mark every notice of the person read
      description: Forwarded to portal-api (POST /api/portal/me/notices/read-all) with the person's bearer.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Read
          content:
            application/json:
              schema:
                type: object
                properties:
                  read: { type: integer, description: How many it marked }
                  unread: { type: integer, enum: [0] }
        "401":
          description: No bearer, or one that is not valid
        "502":
          $ref: "#/components/responses/NoticesUnavailable"
        "503":
          $ref: "#/components/responses/NoticesUnavailable"
  /v1/notices/{noticeId}:
    delete:
      summary: Delete one of the person's notices
      description: Forwarded to portal-api (DELETE /api/portal/me/notices/{noticeId}) with the person's bearer.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/NoticeID"
      responses:
        "204":
          description: Deleted
        "401":
          description: No bearer, or one that is not valid
        "404":
          $ref: "#/components/responses/NoNotice"
        "502":
          $ref: "#/components/responses/NoticesUnavailable"
        "503":
          $ref: "#/components/responses/NoticesUnavailable"
  /v1/feedback:
    post:
      summary: Submit a bug / feedback report (becomes an OpenProject ticket)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [report]
              properties:
                report:
                  type: object
                  required: [source, kind, description]
                  properties:
                    source: { type: string, enum: [web, mobile, tv] }
                    kind: { type: string, enum: [manual, error, crash, player] }
                    title: { type: string }
                    description: { type: string }
                    fingerprint:
                      type: string
                      description: >-
                        Lowercase hex SHA-256 of the failure's signature: its error name, its
                        message with UUIDs and digit runs replaced, and its top three stack
                        frames without query strings or line and column numbers. The same
                        failure gives the same fingerprint in every session of one client;
                        clients need not agree with each other. Omit for manual reports. A
                        fingerprint seen within 14 days is added to its work package (200,
                        `duplicate: true`).
                    context:
                      type: object
                      additionalProperties: { type: string }
                screenshot:
                  type: string
                  format: binary
                  description: image/png or image/jpeg, max 3 MB
      responses:
        "200":
          description: Deduplicated — comment appended to the existing ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  url: { type: string }
                  duplicate: { type: boolean }
        "201":
          description: New ticket created (same body shape, duplicate=false)
        "400":
          description: Invalid report (bad enum, empty description, oversized or non-png/jpeg screenshot)
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: Rate limited (5 reports / 10 min per user)
        "503":
          description: >-
            Feedback pipeline not configured (no OpenProject token); or
            "account busy", with Retry-After, where the account's check waited
            more than 3 seconds for its deletion under way to end. Plain text.
          content:
            text/plain:
              schema: { type: string, example: feedback not configured }
  /v1/admin/items/{id}/package:
    description: >-
      An admin's: the bearer must carry the admin role in its realm roles
      (realm_access.roles; zaentrum-admin unless ADMIN_ROLE names another).
      Both methods are forwarded to katalog-manager with the bearer, which
      checks it again, and its answer comes back as it is, but for a
      redirect's Location: a redirect is not followed. A stream token is
      not taken.
    parameters:
      - $ref: "#/components/parameters/ItemID"
    post:
      summary: Package an item (katalog-manager's POST /api/items/{id}/package)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: >-
            The packaging is enqueued, or already under way: a movie's or an
            episode's status, alreadyActive and message; a series' episodes
            enqueued of its episodes, and message
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  alreadyActive: { type: boolean }
                  episodesEnqueued: { type: integer }
                  episodesTotal: { type: integer }
                  message: { type: string }
        "400":
          description: The item cannot be packaged (not a movie, an episode or a series)
        "401":
          description: No bearer, or one that is not valid
        "403":
          description: The bearer does not carry the admin role
        "404":
          description: No such item
        "502":
          description: katalog-manager did not answer
        "503":
          description: No katalog-manager configured (KATALOG_MANAGER_URL)
    get:
      summary: An item's processing steps, to watch its packaging (katalog-manager's GET /api/analyze/items/{id}/steps)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The item's steps by name, each with its status
          content:
            application/json:
              schema:
                type: object
                properties:
                  itemId: { type: string }
                  steps:
                    type: object
                    additionalProperties: { type: string }
                    example: { transcode: done, package: in_progress }
        "401":
          description: No bearer, or one that is not valid
        "403":
          description: The bearer does not carry the admin role
        "502":
          description: katalog-manager did not answer
        "503":
          description: No katalog-manager configured (KATALOG_MANAGER_URL)
  /v1/admin/accounts/{sub}/data:
    delete:
      summary: Delete what chino keeps of an account an admin deletes (for portal-api)
      description: >-
        portal-api calls it when an admin deletes someone on the People page,
        before it deletes their account: the admin's bearer, carrying the
        admin role, and the account deletion token. Deleting an account
        chino keeps nothing of is no error. The deletion is committed at
        once: where portal-api then cannot delete the account, the person,
        who still has it, cannot write for up to an hour, until portal-api
        has the deletion forgotten (DELETE /v1/admin/accounts/{sub}/deleted),
        as it is to do.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: sub
          required: true
          description: The account's subject (its id in the platform's realm)
          schema: { type: string }
        - $ref: "#/components/parameters/DeletionToken"
      responses:
        "200":
          description: The account's data, deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { $ref: "#/components/schemas/DeletedData" }
                  deletion:
                    type: string
                    description: >-
                      This deletion's own value, random, a new one for each
                      deletion: what DELETE /v1/admin/accounts/{sub}/deleted
                      takes to forget this deletion and no other. Not sent
                      by a server without a database.
        "401":
          description: No bearer, or one that is not valid
        "403":
          description: The bearer does not carry the admin role, or the deletion token is missing or wrong
        "501":
          description: Account deletion is not set up (no ACCOUNT_DELETION_TOKEN)
  /v1/admin/accounts/{sub}/deleted:
    delete:
      summary: Forget an admin's deletion of an account that stays (for portal-api)
      description: >-
        For portal-api to call where it cannot delete the account after
        chino-api deleted the account's data: the person still has their account, and
        chino-api stops keeping that deletion's id, so that their writes go in
        again at once and are no longer answered account_deleted. Only the
        deletion named is forgotten: where another deletion of the account
        has kept its id since (the person's own among them), that one stays.
        The data deleted stays deleted. The admin's bearer, carrying the admin
        role, and the account deletion token, as for the data.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: sub
          required: true
          description: The account's subject (its id in the platform's realm)
          schema: { type: string }
        - in: query
          name: deletion
          required: true
          description: The deletion's value, as DELETE /v1/admin/accounts/{sub}/data answered it (deletion), given once
          schema: { type: string }
        - $ref: "#/components/parameters/DeletionToken"
      responses:
        "204":
          description: >-
            The deletion forgotten; on a server without a database, which
            keeps no id, nothing to forget
        "400":
          description: No deletion, or deletion given twice, as plain text
        "503": { $ref: "#/components/responses/AccountBusy" }
        "409":
          description: >-
            No id of this deletion is kept, so there is nothing of its own to
            undo: it was forgotten already or is past its hour, swept or not,
            or another deletion of the account has kept its own id since,
            which stays.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionNotKept" }
              example: { error: deletion_not_kept, detail: "no id of this deletion is kept: nothing of its own to undo" }
        "401":
          description: No bearer, or one that is not valid
        "403":
          description: The bearer does not carry the admin role, or the deletion token is missing or wrong
        "501":
          description: Account deletion is not set up (no ACCOUNT_DELETION_TOKEN)
components:
  parameters:
    DeletionToken:
      in: header
      name: X-Account-Deletion-Token
      required: true
      description: >-
        The account deletion token chino-api and portal-api share
        (ACCOUNT_DELETION_TOKEN): the call comes from the service that
        deletes the account, and from no client.
      schema: { type: string }
    ItemID:
      in: path
      name: id
      required: true
      description: >
        A title's id. A capped viewer gets 404 for a title its cap does not
        allow, as for an id of no title.
      schema: { type: string }
    ExtraID:
      in: path
      name: extraId
      required: true
      description: >
        The id of one of the title's extras, as the item detail lists it (a
        UUID). Anything else is 404, and goes nowhere; so is an extra of
        another title.
      schema: { type: string, format: uuid }
    Caps:
      in: query
      name: caps
      description: >
        What the client decodes, comma-separated: video avc, hvc, av1, vp9,
        each with an optional ":<height>" (the hardware decoder's tallest
        frame, e.g. hvc:1080); audio aac, mp3, opus, vorbis, ac3, eac3;
        aacmc for AAC beyond two channels. Without it: H.264, VP9, AV1,
        AAC, MP3, Opus, Vorbis — no HEVC.
      schema: { type: string, example: "avc:2160,hvc:2160,aac,eac3" }
    Quality:
      in: query
      name: q
      description: >
        auto (default) or the name of an entry of /play/info's qualities.
        On an on-the-fly title high, medium or low; on a packaged title
        those mean auto.
      schema: { type: string, example: "v1" }
    StartSeconds:
      in: query
      name: t
      description: Seconds into the title the client starts at; what is warmed from.
      schema: { type: number, minimum: 0 }
    NoticeID:
      in: path
      name: noticeId
      required: true
      description: >
        A notice's id, as GET /api/v1/notices lists it: letters, digits and
        dashes (portal-api's are UUIDs). Anything else is 404, and goes
        nowhere.
      schema: { type: string, pattern: "^[A-Za-z0-9-]{1,64}$" }
  responses:
    AccountBusy:
      description: >-
        "account busy", as plain text: the request waited more than 3 seconds
        for the account's deletion under way to end, and gave up; nothing was
        written. Send it again after Retry-After. A deletion can stay open for
        most of a minute, so the request sent again can be busy again; once
        the deletion is committed, it is answered account_deleted.
      headers:
        Retry-After:
          description: Seconds to wait before sending it again
          schema: { type: integer, example: 5 }
      content:
        text/plain:
          schema: { type: string, example: account busy }
    Unauthorized:
      description: >-
        No bearer, or one that is not valid, as plain text; or account_deleted,
        a write for an account whose deletion has begun, sent while it is open
        or after it: nothing more is kept for the account, and the app signs
        it out.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AccountDeleted" }
          example: { error: account_deleted, detail: "the account's deletion has begun: nothing more is kept for it" }
        text/plain:
          schema: { type: string, example: invalid token }
    NoNotice:
      description: The person has no notice of that id — someone else's is as one there is not
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NoticeRefusal" }
    NoticesUnavailable:
      description: >-
        portal-api did not change the notice — 502: it did not answer, or not
        as it does; 503: this server has none configured. The app keeps the
        notice as it was.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NoticeRefusal" }
  schemas:
    AppConfig:
      type: object
      required: [product, apiBase, oidcIssuer, oidcAudience, oidcEnabled, oidcClientId, features]
      properties:
        product: { type: string, enum: [chino] }
        apiBase:
          type: string
          description: >-
            Where this server's API is reached, <origin>/api: PUBLIC_BASE_URL's
            origin where it is set, else the request's: its Host where that is
            a host and a port of 1 to 65535, nothing more, and its
            X-Forwarded-Proto behind a proxy where that is http or https;
            "/api" for a Host of any other form
        oidcIssuer: { type: string, description: "The identity provider a client signs in with (OIDC_ISSUER)" }
        oidcAudience: { type: string, description: "The audience a bearer is checked for (OIDC_AUDIENCE)" }
        oidcEnabled:
          type: boolean
          description: Whether a bearer is checked; false (OIDC_ENABLED=false) lets a request through without one
        oidcClientId:
          type: object
          description: The public client (no secret) each platform signs in with
          required: [tv, mobile, web, portal]
          properties:
            tv: { type: string, description: OIDC_CLIENT_ID_TV }
            mobile: { type: string, description: OIDC_CLIENT_ID_MOBILE }
            web: { type: string, description: OIDC_CLIENT_ID_WEB }
            portal: { type: string, description: OIDC_CLIENT_ID_PORTAL }
        features:
          type: object
          description: What this server offers; a client shows each only where it is true
          required: [feedback, downloads, watchlist_kinds]
          properties:
            feedback:
              type: boolean
              description: >-
                POST /api/v1/feedback files bug reports: an OpenProject token is
                configured (OPENPROJECT_TOKEN). False, it answers 503.
            downloads:
              type: boolean
              description: >-
                A phone may keep a packaged title to play without a connection
                (DOWNLOADS_ENABLED, true unless it is false, 0, no or off). False,
                a client offers no download.
            watchlist_kinds:
              type: boolean
              description: >-
                The account keeps whether its lists show movies and shows apart
                (GET and PATCH /api/v1/me/settings, watchlist_by_kind), and a list
                is answered by kind (kind, include=counts): true on a server with
                a database and sign-in on. False, a client leaves the setting out.
    Notice:
      type: object
      required: [id, addon, addonTitle, title, body, link, itemId, createdAt, readAt]
      description: >
        What an addon told the person, as portal-api keeps it. Plain text,
        shown as text: a title of at most 80 characters, a body of at most
        280 that may hold line breaks.
      properties:
        id: { type: string, example: 3f2b9c1e-0b7a-4c55-9d1e-2a4f6b8c0d1e }
        addon: { type: string, description: "The addon's key", example: example }
        addonTitle: { type: string, description: "The addon's app title: whom the notice is from", example: Example }
        addonIcon: { type: string, description: "The addon's app icon, a lucide name; '' for none", example: puzzle }
        title: { type: string, maxLength: 80 }
        body: { type: string, maxLength: 280 }
        link:
          type: string
          description: >
            '' for none; else a path on the server, or an absolute http(s)
            URL on its own origin — portal-api checks it as it checks a slot
            row's link. A client follows it only to its own server.
        itemId:
          type: string
          description: "'' for none; else a title's id, opened with the item routes"
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true, description: null while unread }
    NoticeList:
      type: object
      required: [notices, unread, available]
      properties:
        notices:
          type: array
          description: Newest first; the person keeps their newest 100
          items: { $ref: "#/components/schemas/Notice" }
        unread: { type: integer }
        available:
          type: boolean
          description: false when no portal-api answered — the list is empty then, and says nothing about the person's notices
    NoticeRefusal:
      type: object
      properties:
        error: { type: string, enum: [not_found, notices_unavailable] }
        message: { type: string, description: For the person }
    DeletedData:
      type: object
      description: How many rows of each kind were deleted.
      properties:
        progress: { type: integer }
        watched: { type: integer }
        watchlists: { type: integer }
        watchlistItems: { type: integer }
        likes: { type: integer }
        legacyWatchlist: { type: integer }
        settings: { type: integer }
    AccountRefusal:
      type: object
      properties:
        error: { type: string, enum: [refused, account_not_deleted, account_deletion_unavailable, data_not_deleted, bearer_in_url] }
        message: { type: string, description: For the person }
    PlayInfo:
      type: object
      description: Every field but mode is omitted or null where it does not apply.
      properties:
        mode: { type: string, enum: [packaged, transcode, remux, passthrough] }
        reason: { type: string }
        filename: { type: string }
        container: { type: string }
        video_codec:
          type: string
          description: packaged — the CODECS entry of the rung the client starts on
        audio_codec: { type: string }
        width: { type: integer }
        height: { type: integer }
        duration_ms: { type: integer }
        encoder: { type: string, description: "on the fly: libx264 or h264_nvenc" }
        qualities:
          type: array
          nullable: true
          description: >
            packaged: Auto first, then one entry per picture size the client
            decodes at its heights, tallest first (null when fewer than two
            rungs to pick from); transcode: high, medium, low. A menu shows
            them by label and reloads the master with q=<name>.
          items: { $ref: "#/components/schemas/PlayQuality" }
        default_quality: { type: string, description: "packaged: auto; transcode: high" }
        audio_tracks:
          type: array
          description: packaged — the stereo tracks
          items: { type: object }
        subtitle_tracks:
          type: array
          description: packaged — the sidecars, a WebVTT one with its HLS rendition dir (hls)
          items: { type: object }
        pictureArea: { $ref: "#/components/schemas/PictureArea" }
    PictureArea:
      type: object
      required: [left, top, width, height]
      description: >
        Where the picture is in a frame that keeps black bars in it - a wider
        picture letterboxed in a 16:9 frame, a narrower one pillarboxed - as
        fractions (0-1, four decimals) of the coded frame the client is
        served: the union of the picture over the whole title. A player that
        fills the screen fits this rectangle to it rather than the whole
        frame. Omitted when the catalog has none, when it is the whole frame,
        and when the frame served has another shape than the one measured.
      properties:
        left: { type: number, minimum: 0, maximum: 1, example: 0 }
        top: { type: number, minimum: 0, maximum: 1, example: 0.1278 }
        width: { type: number, minimum: 0, maximum: 1, example: 1 }
        height: { type: number, minimum: 0, maximum: 1, example: 0.7444 }
    PlayQuality:
      type: object
      required: [name, label]
      properties:
        name: { type: string, description: "the q value: auto, a rung id (v1) or high/medium/low", example: v1 }
        label: { type: string, example: 720p }
        id: { type: string, description: "packaged rungs: the rung id", example: v1 }
        width: { type: integer, example: 1280 }
        height: { type: integer, example: 720 }
        codec: { type: string, example: avc1.64001f }
        bitrate: { type: integer, description: "bit/s, the variant's BANDWIDTH", example: 1505267 }
        video_range: { type: string, enum: [SDR, PQ, HLG] }
    Item:
      type: object
      description: The fields a detail page uses; others are omitted here.
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        year: { type: integer }
        poster_url: { type: string }
        backdrop_url: { type: string }
        min_age:
          type: integer
          minimum: 0
          maximum: 21
          description: >
            The age a viewer must be to be served the title: an admin's rating,
            else (an episode) its series', else the minimum age its
            certification means; omitted when nothing rates it, 0 sent.
        certification:
          type: string
          description: >
            The certification the age comes from, as TMDB gives it in its
            country ("12" in DE is FSK 12); omitted when an admin rated the
            title by hand, or nothing rates it.
          example: PG-13
        certification_country:
          type: string
          description: The certification's country, ISO 3166-1 alpha-2.
          example: US
        coveredBy:
          type: string
          description: >
            On an episode whose file is another's (one file that holds several
            episodes, a double-length finale listed as two): the id of the
            episode that holds the file, its holder, the first of them. It
            plays the holder's package. The viewer's progress and watched
            state are the file's: a write for any of its episodes is written
            for each, and the next episode is the one after the file's last.
            Omitted on every other item, as the catalog's name for it.
        covers:
          type: array
          items: { type: string }
          description: >
            On the holder of a file that holds several episodes: the ids of
            the others, in episode order. Omitted on every other item.
        episodeEnd:
          type: integer
          description: >
            On the holder of a file that holds several episodes: the last
            episode number the file holds; a client can show the holder as
            E15–16, from its episode number to episodeEnd. Omitted on every
            other item.
          example: 16
        file_duration_ms:
          type: integer
          format: int64
          description: >
            In a series' episode list, on the holder of a file that holds
            several episodes: how long that file is, as measured from its
            package - the length of the one thing that plays, not of any one
            episode (duration_ms). Omitted on every other item, and where the
            file's length is not known.
          example: 2766000
        genres:
          type: array
          items: { type: string }
        cast:
          description: >
            As the catalog orders and caps it: role by role (actor, creator,
            director, writer, producer, composer, cinematographer, editor,
            then any other role alphabetically), billing order within a role;
            at most 20 actors and 10 people of every other role.
          type: array
          items: { $ref: "#/components/schemas/CastEntry" }
        subtitles:
          description: >
            The sidecar subtitles of the file the item plays, as the catalog
            lists them, without their URLs (the subtitles list has those).
          type: array
          items: { $ref: "#/components/schemas/ItemSubtitle" }
        trailers:
          description: >
            The title's links to online videos, as the catalog has them: each
            with its url, which a client opens outside the app. Nothing else
            is in it (a trailer this server plays is in extras). Omitted when
            there is none.
          type: array
          items: { $ref: "#/components/schemas/Trailer" }
        extras:
          description: >
            On a movie or a series: its extras that play here (a trailer, a
            teaser, a featurette, …, each a file of its own, packaged for
            streaming), in the order a viewer sees them, each at its
            play_path. Omitted when none plays, and while the catalog has no
            extras yet.
          type: array
          items: { $ref: "#/components/schemas/Extra" }
        roles:
          description: on a person's filmography only, the person's roles on the item
          type: array
          items: { type: string }
        match:
          type: string
          enum: [exact, prefix, words, alternative, similar, plot]
          description: >
            On a search's titles only: how the title matched the query, its
            tier, best first: it is the query, begins with it, holds every word
            of it, a series' other name does, it is close to it (a typo), its
            plot holds it (only when no title matched). An episode ranks after
            every film and series.
        series:
          type: object
          description: On an episode a search found, its series.
          required: [id, title, matched]
          properties:
            id: { type: string }
            title: { type: string }
            matched: { type: boolean, description: "the series matched the query by its own title too" }
            poster_url: { type: string }
        watched_at: { type: string, format: date-time }
    ItemSubtitle:
      type: object
      required: [id, lang]
      description: A subtitle of the file an item plays, as the item lists it.
      properties:
        id: { type: string }
        lang: { type: string, example: en }
        label: { type: string }
        format: { type: string, example: webvtt }
        default: { type: boolean }
        forced: { type: boolean }
        styled_format:
          type: string
          enum: [ass]
          description: >-
            The format of the styled original its package keeps beside its
            file; omitted for a subtitle without one. The subtitles list
            offers it in styled.
    SidecarSubtitle:
      type: object
      required: [id, lang, url]
      description: A subtitle of the file an item plays, as the subtitles list gives it.
      properties:
        id: { type: string }
        lang: { type: string, example: en }
        label: { type: string }
        format:
          type: string
          description: The format url serves (webvtt for a SubRip file; pgs, vobsub, dvb for a bitmap one).
          example: webvtt
        default: { type: boolean }
        forced:
          type: boolean
          description: A subtitle a player shows by itself for the language it is in.
        url:
          type: string
          description: Where every client plays it from.
        styled:
          type: object
          required: [url, format]
          description: >-
            Its styled original, which its package keeps beside it, for a
            player that draws styles: omitted for a subtitle without one.
          properties:
            url: { type: string, description: "The script: /api/v1/play/subs/{id}.ass" }
            format: { type: string, enum: [ass], description: An ASS or an SSA script }
    Font:
      type: object
      required: [id, names, url]
      description: A font of the package an item plays, which its styled subtitles are drawn with.
      properties:
        id: { type: string }
        format:
          type: string
          enum: [ttf, otf, ttc, woff, woff2]
          description: The format its bytes are; omitted for a font of none of them.
        names:
          type: array
          items: { type: string }
          description: >-
            The names a style or an override tag asks for it by (its family,
            full and PostScript names); a libass renderer looks a font up by
            them, case-insensitively. Empty when none could be read.
        url: { type: string, description: "/api/v1/play/fonts/{id}.{ext}" }
    Trailer:
      type: object
      required: [url]
      description: A link to an online video of the title; every optional field is omitted when unknown.
      properties:
        site: { type: string, description: "the site the video is on", example: YouTube }
        external_id: { type: string, description: "the video's id there" }
        url: { type: string, description: "always sent; a client opens it outside the app" }
        title: { type: string }
    Extra:
      type: object
      required: [id, kind, title, local, play_path]
      description: One extra of a movie or a series that plays here; every optional field is omitted when unknown.
      properties:
        id: { type: string, format: uuid, example: 1b5c2a8e-6f0d-4c3e-9a51-2d7f0c4b8e01 }
        kind:
          type: string
          description: >
            One of trailer, teaser, featurette, behind-the-scenes, making-of,
            deleted-scene, interview, gag-reel, short, other. A client may
            skip kinds it does not know.
          example: trailer
        title:
          type: string
          description: What a viewer sees, its label when one is set (nothing sets one yet) else the title the extra was taken in with
          example: Trailer
        language: { type: string, description: "the language spoken in it, as taken in: BCP 47 or ISO 639-2 (en, eng; zxx none)", example: en }
        duration_ms: { type: integer, example: 33000 }
        season_number:
          type: integer
          minimum: 0
          description: On a series' extra of one season only, that season (0 the specials)
        local:
          type: boolean
          description: Always true; the extra plays from this server (a link to elsewhere is a trailer)
        play_path:
          type: string
          description: >
            Its HLS master on this server, asked for as a title's master is:
            with ?stream=<a stream token> and &caps=<what the client decodes>.
          example: /api/v1/items/9c4e7a12-3b5d-4f60-8a91-0e2d4c6b8f13/extras/1b5c2a8e-6f0d-4c3e-9a51-2d7f0c4b8e01/play/master.m3u8
    CastEntry:
      type: object
      required: [name, role]
      description: One credit; every optional field is omitted when unknown.
      properties:
        person_id: { type: string }
        name: { type: string }
        role:
          type: string
          description: open vocabulary; a client shows the roles it knows
        job: { type: string, example: Screenplay }
        character: { type: string }
        order: { type: integer, minimum: 0, description: "billing order within the role, 0 first" }
        episode_count: { type: integer }
    Person:
      type: object
      required: [id, name, has_profile]
      properties:
        id: { type: string }
        name: { type: string }
        credits: { type: integer, description: "search results: the number of titles" }
        has_profile: { type: boolean }
        profile_url:
          type: string
          description: set when has_profile; /api/v1/people/{id}/profile
        match:
          type: string
          enum: [exact, prefix, words, alternative, similar]
          description: >
            On /v1/search only: how the name matched the query (alternative:
            another name the person is known by).
    PersonDetail:
      allOf:
        - $ref: "#/components/schemas/Person"
        - type: object
          description: Every optional field is omitted when unknown.
          properties:
            sort_name: { type: string }
            also_known_as:
              type: array
              items: { type: string }
            birth_date: { type: string, format: date }
            death_date: { type: string, format: date }
            birthplace: { type: string }
            known_for_department: { type: string }
            biography: { type: string }
            biography_lang: { type: string, description: "a primary language subtag" }
            tmdb_person_id: { type: string }
            imdb_id: { type: string }
            items:
              type: array
              items: { $ref: "#/components/schemas/Item" }
    Watchlist:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        itemCount: { type: integer }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }
        counts:
          type: object
          description: GET /api/v1/me/watchlists with include=counts alone; the list's titles by kind
          properties:
            movie: { type: integer, example: 4 }
            series: { type: integer, description: series, episodes and every other kind, example: 3 }
    Settings:
      type: object
      required: [watchlist_by_kind]
      properties:
        watchlist_by_kind:
          type: boolean
          description: Whether every list shows its movies and its shows apart; false while nothing is set
    SettingsChange:
      type: object
      additionalProperties: false
      properties:
        watchlist_by_kind:
          type: boolean
          nullable: true
          description: null puts it back to false
    SettingRefusal:
      type: object
      required: [error, detail]
      description: >-
        ADR-0023, part 4: the case's code, the values its sentence needs, and
        a line of English for the log and for details, never a sentence for
        a person. A code that needs no values sends no values.
      properties:
        error: { type: string, enum: [setting_unknown, watchlist_by_kind_invalid] }
        values:
          type: object
          description: setting_unknown alone; watchlist_by_kind_invalid sends none
          properties:
            name: { type: string, description: The field the store does not keep }
        detail: { type: string }
    DeletionNotKept:
      type: object
      required: [error, detail]
      description: >-
        ADR-0023, part 4: deletion_not_kept, a code that needs no values and
        sends none, and a line of English for the log and for details.
      properties:
        error: { type: string, enum: [deletion_not_kept] }
        detail: { type: string }
    AccountDeleted:
      type: object
      required: [error, detail]
      description: >-
        ADR-0023, part 4: account_deleted, a code that needs no values and
        sends none, and a line of English for the log and for details.
      properties:
        error: { type: string, enum: [account_deleted] }
        detail: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    streamToken:
      type: apiKey
      in: query
      name: stream
      description: >
        a stream token from POST /api/v1/me/stream-token; a capped viewer's
        carries its cap, signed with the rest
